<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none">
  <!-- Icon Mark: Stylized building/P with angular roof -->
  <g>
    <!-- Building base -->
    <rect x="2" y="18" width="14" height="18" rx="1.5" fill="#0A1628"/>
    <!-- Roof / angular peak -->
    <path d="M0 20 L9 8 L18 20" fill="#C9A255"/>
    <!-- Window dot accent -->
    <circle cx="9" cy="24" r="2.5" fill="white" opacity="0.9"/>
    <!-- Thin vertical accent line -->
    <rect x="8" y="28" width="2" height="8" rx="1" fill="#C9A255" opacity="0.7"/>
  </g>
  
  <!-- Wordmark: PLOTIX -->
  <text x="26" y="28" font-family="'Georgia', 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#0A1628">PLOTIX</text>
  
  <!-- Tagline -->
  <text x="26.5" y="37" font-family="'Georgia', serif" font-size="6.5" font-weight="400" letter-spacing="3.8" fill="#C9A255" opacity="0.9">REALITY</text>
</svg>
